# fly.toml app configuration file generated for browser-snake on 2026-07-21T11:30:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'browser-snake'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
